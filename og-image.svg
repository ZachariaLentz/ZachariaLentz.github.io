<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="12" height="630" fill="#2563eb"/>

  <!-- Main heading -->
  <text x="100" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff">
    Zacharia Lentz
  </text>

  <!-- Positioning -->
  <text x="100" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#60a5fa">
    Maintenance &amp; Reliability Leader
  </text>

  <text x="100" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="500" fill="#e2e8f0">
    CMMS Administration • Industrial Implementation
  </text>

  <!-- Description -->
  <text x="100" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="400" fill="#e2e8f0">
    Tesla Production Engineering Supervisor
  </text>

  <!-- Location/call to action -->
  <text x="100" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">
    20+ technicians • 3 automated Powerwall production lines
  </text>

  <text x="100" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
    Sparks, Nevada → Midland, Michigan area
  </text>

  <!-- Right accent element -->
  <circle cx="1150" cy="100" r="60" fill="#dc2626" opacity="0.2"/>
  <circle cx="1100" cy="530" r="80" fill="#2563eb" opacity="0.15"/>
</svg>
